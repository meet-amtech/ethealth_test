{% extends "base.html" %}
{% load static %}
{% load custom_filters %}

{% block css %}
{% endblock %}

{% block content %}

<form method="POST" action="{% url 'template_clinic:leave_create' %}">
    {% csrf_token %}
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="row">
                <div class="col-sm-7 col-6">
                    <h4 class="page-title">Add Leave</h4>
                </div>
                <div class="col-sm-5 col-6 text-right m-b-30">
                    <button class="btn btn-primary submit-btn">Apply for Leave</button>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>From <span class="text-danger">*</span></label>
                        <div class="cal-icon">
                            <input class="form-control datetimepicker" name="start_date" type="text">
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>To <span class="text-danger">*</span></label>
                        <div class="cal-icon">
                            <input class="form-control datetimepicker" name="end_date" type="text">
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Leave Reason <span class="text-danger">*</span></label>
                <textarea rows="4" cols="5"  name="description" class="form-control"></textarea>
            </div>
        </div>
    </div>

</form>

{% endblock %}

{% block script %}
{% endblock %}
