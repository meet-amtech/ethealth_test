{% load static %}

<!DOCTYPE html>
<html lang="en">


<!-- login23:11-->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <link rel="shortcut icon" type="image/x-icon" href=" {% static 'assets/img/favicon.ico' %}">
    <title>ETHealth</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href=" {% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href=" {% static 'assets/css/font-awesome.min.css' %}">
    <link rel="stylesheet" type="text/css" href=" {% static 'assets/css/style.css' %}">
    <!--[if lt IE 9]>
		<script src=" {% static 'assets/js/html5shiv.min.js' %}"></script>
		<script src=" {% static 'assets/js/respond.min.js' %}"></script>
	<![endif]-->
</head>

<body>
    <style>
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(120deg, #f8f9fa, #e3f2fd);
            overflow: hidden;
        }
        
        .medical-icon {
            position: absolute;
            opacity: 0.15;
            color: #2196f3;
            animation: float 5s infinite ease-in-out;
        }
        
        .medical-icon:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .medical-icon:nth-child(2) { top: 20%; left: 30%; animation-delay: 0.5s; }
        .medical-icon:nth-child(3) { top: 15%; left: 50%; animation-delay: 1s; }
        .medical-icon:nth-child(4) { top: 25%; left: 70%; animation-delay: 1.5s; }
        .medical-icon:nth-child(5) { top: 10%; left: 90%; animation-delay: 2s; }
        .medical-icon:nth-child(6) { top: 35%; left: 15%; animation-delay: 2.5s; }
        .medical-icon:nth-child(7) { top: 45%; left: 35%; animation-delay: 3s; }
        .medical-icon:nth-child(8) { top: 40%; left: 55%; animation-delay: 3.5s; }
        .medical-icon:nth-child(9) { top: 50%; left: 75%; animation-delay: 4s; }
        .medical-icon:nth-child(10) { top: 30%; left: 85%; animation-delay: 4.5s; }
        .medical-icon:nth-child(11) { top: 60%; left: 20%; animation-delay: 0.2s; }
        .medical-icon:nth-child(12) { top: 70%; left: 40%; animation-delay: 0.7s; }
        .medical-icon:nth-child(13) { top: 65%; left: 60%; animation-delay: 1.2s; }
        .medical-icon:nth-child(14) { top: 75%; left: 80%; animation-delay: 1.7s; }
        .medical-icon:nth-child(15) { top: 80%; left: 25%; animation-delay: 2.2s; }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(30px) rotate(15deg) scale(1.2); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.3); opacity: 0.25; }
            100% { transform: scale(1); opacity: 0.15; }
        }
    </style>

    <div class="animated-bg">
        <i class="fa fa-heartbeat fa-3x medical-icon"></i>
        <i class="fa fa-stethoscope fa-3x medical-icon"></i>
        <i class="fa fa-hospital-o fa-3x medical-icon"></i>
        <i class="fa fa-ambulance fa-3x medical-icon"></i>
        <i class="fa fa-user-md fa-3x medical-icon"></i>
        <i class="fa fa-medkit fa-3x medical-icon"></i>
        <i class="fa fa-plus-square fa-3x medical-icon"></i>
        <i class="fa fa-wheelchair fa-3x medical-icon"></i>
        <i class="fa fa-h-square fa-3x medical-icon"></i>
        <i class="fa fa-heartbeat fa-3x medical-icon"></i>
        <i class="fa fa-stethoscope fa-3x medical-icon"></i>
        <i class="fa fa-hospital-o fa-3x medical-icon"></i>
        <i class="fa fa-ambulance fa-3x medical-icon"></i>
        <i class="fa fa-user-md fa-3x medical-icon"></i>
        <i class="fa fa-medkit fa-3x medical-icon"></i>
    </div>

    <div class="main-wrapper account-wrapper">
        <div class="account-page">
			<div class="account-center">
				<div class="account-box">

                    {% block content %}
                    {% endblock %}

                </div>
			</div>
        </div>
    </div>
    <script src=" {% static 'assets/js/jquery-3.2.1.min.js' %}"></script>
	<script src=" {% static 'assets/js/popper.min.js' %}"></script>
    <script src=" {% static 'assets/js/bootstrap.min.js' %}"></script>
    <script src=" {% static 'assets/js/app.js' %}"></script>

    {% block script %}
    {% endblock %}

</body>


<!-- login23:12-->
</html>
