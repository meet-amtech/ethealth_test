{% extends "auth/login-base.html" %}
{% load static %}

{% block content %}

{% for message in messages %}
<div class="{{ message.tags }} alert-dismissible fade show" role="alert">
    {{ message }}
    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
{% endfor %}

<form action="{% url 'template_user:otp' %}" method="POST" class="form-signin">
    {% csrf_token %}
    <div class="text-center mb-4">
        <h2 class="welcome-text">Welcome Back!</h2>
        <p class="text-muted">Please login to access your account</p>
    </div>
    <div class="account-logo mb-4">
        <a><img src="{% static 'assets/img/logo-dark.png' %}" alt=""></a>
    </div>
    <div class="form-group">
        <label class="font-weight-bold">Phone Number</label>
        <div class="input-group">
            <div class="input-group-prepend">
                <span class="input-group-text"><i class="fa fa-phone"></i></span>
            </div>
            <input type="tel" name="phone" id="phone" autofocus="" class="form-control" pattern="[0-9]{10}" maxlength="10"  placeholder="Enter 10 digit mobile number">
        </div>
    </div>
    <div class="form-group">
        <button type="submit" id="send-otp" class="btn btn-primary btn-block btn-lg">Send OTP</button>
    </div>
</form>

{% endblock %}


{% block script %}

<script>
    // Function to focus the button and add an event listener for the Enter key
    window.onload = function() {
        const button = document.getElementById('send-otp');
        button.focus(); // Focus the button
        // Add an event listener for the Enter key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                button.click(); // Trigger the button click
            }
        });
    };
</script>

{% endblock %}
