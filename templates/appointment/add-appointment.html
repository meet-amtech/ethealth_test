{% extends "base.html" %}
{% load static %}
{% load custom_filters %}

{% block css %}
{% endblock %}

{% block content %}
    
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <h4 class="page-title">Add Appointment</h4>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <form method="POST" action="{% url 'template_appointment:appointment_create' %}">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Clinic</label>
                <input class="form-control" type="text" value="{{ clinic.name }}" readonly />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Doctor <span style="color: red;">*</span></label>
                <select class="form-control" name="doctor_id" required>
                  <option value="">Select Doctor</option>
                  {% for doctor in doctors %}
                    <option value="{{ doctor.id }}">{{ doctor.name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Patient Name <span style="color: red;">*</span></label>
                <input class="form-control" type="text" name="patient_name" required />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Patient Phone Number</label>
                <input class="form-control" type="text" name="patient_phone" maxlength="10" pattern="[0-9]{10}" placeholder="10 digit phone number" />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Patient Age</label>
                <input class="form-control" type="number" name="patient_age" min="0" max="150" />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Patient Gender</label>
                <select class="form-control" name="patient_gender">
                  <option value="">Select Gender</option>
                  {% for value, label in gender_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Appointment Date <span style="color: red;">*</span></label>
                <div class="cal-icon">
                  <input type="text" class="form-control datetimepicker" name="appointment_date" required />
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Appointment Time <span style="color: red;">*</span></label>
                <div class="time-icon">
                  <input type="text" class="form-control" id="datetimepicker3" name="appointment_time" required />
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Duration (minutes)</label>
                <input class="form-control" type="number" name="duration_minutes" value="30" min="5" max="480" />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Amount to Pay</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text">₹</span>
                  </div>
                  <input class="form-control" type="number" name="amount_to_pay" min="0" step="0.01" />
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label>Notes</label>
                <textarea class="form-control" name="notes" rows="3"></textarea>
              </div>
            </div>
          </div>
          <div class="m-t-20 text-center">
            <button id="create-appointment" class="btn btn-primary submit-btn" type="submit">
              Create Appointment
            </button>
          </div>
        </form>
      </div>
    </div>
    
    {% endblock %}

{% block script %}

<script>
  $(function () {
    $("#datetimepicker3").datetimepicker({
      format: "LT",
    });
    $("#datetimepicker4").datetimepicker({
      format: "LT",
    });
  });

  // Function to focus the button and add an event listener for the Enter key
  window.onload = function() {
      const button = document.getElementById('create-appointment');
      button.focus(); // Focus the button
      // Add an event listener for the Enter key
      document.addEventListener('keydown', function(event) {
          if (event.key === 'Enter') {
              button.click(); // Trigger the button click
          }
      });
  };

</script>

{% endblock %}
