{% extends "base.html" %}
{% load static %}
{% load custom_filters %}

{% block css %}
{% endblock %}

{% block content %}
    
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <h4 class="page-title">Add Appointment</h4>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <form method="POST" action="{% url 'template_appointment:appointment_create' %}">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Clinic</label>
                <input class="form-control" type="text" value="{{ request.session.clinic_name }}" readonly />
                <input type="hidden" name="clinic" value="{{ request.session.clinic_id }}" />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Doctor</label>
                <input class="form-control" type="text" value="{{ request.user.name }}" readonly />
                <input type="hidden" name="clinic_user" value="{{ request.session.clinic_user_id }}" />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Patient Name <span style="color: red;">*</span></label>
                <input class="form-control" type="text" name="name" required />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Patient Phone Number <span style="color: red;">*</span></label>
                <input class="form-control" type="text" name="phone" required />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Date</label>
                <div class="cal-icon">
                  <input type="text" class="form-control datetimepicker" name="date" required />
                </div>
              </div>
            </div>
          </div>
          <div class="m-t-20 text-center">
            <button id="create-appointment" class="btn btn-primary submit-btn" type="submit">
              Create Appointment
            </button>
          </div>
        </form>
      </div>
    </div>
    
    {% endblock %}

{% block script %}

<script>
  $(function () {
    $("#datetimepicker3").datetimepicker({
      format: "LT",
    });
    $("#datetimepicker4").datetimepicker({
      format: "LT",
    });
  });

  // Function to focus the button and add an event listener for the Enter key
  window.onload = function() {
      const button = document.getElementById('create-appointment');
      button.focus(); // Focus the button
      // Add an event listener for the Enter key
      document.addEventListener('keydown', function(event) {
          if (event.key === 'Enter') {
              button.click(); // Trigger the button click
          }
      });
  };

</script>

{% endblock %}
