{% extends "base.html" %}
{% load static %}
{% load custom_filters %}

{% block css %}
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<!-- DateTime Picker CSS (tempusdominus) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.39.0/css/tempusdominus-bootstrap-4.min.css" />
<style>
    .input-group-text {
        cursor: pointer;
    }
    .input-group-text i {
        pointer-events: none;
    }
</style>
{% endblock %}

{% block content %}
    
<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <h4 class="page-title">Edit Appointment - {{ appointment.clinic_patient.patient.name }}</h4>
    </div>
</div>
<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <form method="POST" action="{% url 'template_appointment:appointment_update' appointment.id %}">
            {% csrf_token %}
            <!-- Hidden doctor field -->
            <input type="hidden" name="doctor_id" value="{{ appointment.doctor.id }}">
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Name <span class="text-danger">*</span></label>
                        <input class="form-control" type="text" name="patient_name" value="{{ appointment.clinic_patient.patient.name }}" required />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Phone Number <span class="text-danger">*</span></label>
                        <input class="form-control" type="text" name="patient_phone" value="{{ phone_number }}" maxlength="10" pattern="[0-9]{10}" placeholder="10 digit phone number" required />
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Date of Birth <span class="text-danger">*</span></label>
                        <div class="input-group date" id="patient_dob_picker" data-target-input="nearest">
                            <input type="text" class="form-control datetimepicker-input" name="patient_dob" 
                                   value="{{ appointment.clinic_patient.patient.date_of_birth|date:'d/m/Y' }}" 
                                   data-target="#patient_dob_picker" data-toggle="datetimepicker" 
                                   placeholder="DD/MM/YYYY" required />
                            <div class="input-group-append" data-target="#patient_dob_picker" data-toggle="datetimepicker">
                                <div class="input-group-text"><i class="far fa-calendar-alt"></i></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Age</label>
                        <input class="form-control" type="number" name="patient_age" 
                               value="{{ appointment.clinic_patient.patient.age|default:'' }}" 
                               min="0" max="150" />
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Gender</label>
                        <select class="form-control" name="patient_gender">
                            <option value="">Select Gender</option>
                            {% for value, label in gender_choices %}
                                <option value="{{ value }}" {% if appointment.clinic_patient.patient.gender == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Status</label>
                        <select class="form-control" name="appointment_status">
                            {% for value, label in status_choices %}
                                <option value="{{ value }}" {% if appointment.appointment_status == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Appointment Date & Time <span class="text-danger">*</span></label>
                        <div class="input-group date" id="appointment_datetime_picker" data-target-input="nearest">
                            <input type="text" class="form-control datetimepicker-input" name="appointment_datetime" 
                                   value="{{ appointment.date_str }} {{ appointment.time_str }}"
                                   data-toggle="datetimepicker" data-target="#appointment_datetime_picker" 
                                   required />
                            <div class="input-group-append" data-target="#appointment_datetime_picker" data-toggle="datetimepicker">
                                <div class="input-group-text"><i class="far fa-calendar-alt"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Token Number</label>
                        <input class="form-control" type="text" value="{% if token_number %}#{{ token_number }}{% else %}-{% endif %}" readonly>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Duration (minutes)</label>
                        <input class="form-control" type="number" name="duration_minutes" value="{{ appointment.duration_minutes }}" min="5" max="480">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Amount To Pay</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">₹</span>
                            </div>
                            <input class="form-control" type="number" min="0" step="0.01" name="amount_to_pay" value="{{ appointment.amount_to_pay|default:0 }}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Payment Status</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="paid" id="paid" {% if appointment.paid %}checked{% endif %}>
                            <label class="form-check-label" for="paid">
                                Mark as Paid
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea class="form-control" name="notes" rows="3">{{ appointment.notes|default:'' }}</textarea>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label>Feedback</label>
                        <textarea class="form-control" name="feedback" rows="3">{{ appointment.feedback|default:'' }}</textarea>
                    </div>
                </div>
            </div>
            <div class="m-t-20 text-center">
                <button id="save-appointment" class="btn btn-primary submit-btn" type="submit">Update Appointment</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block script %}

<!-- DateTime Picker JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.39.0/js/tempusdominus-bootstrap-4.min.js"></script>

<script>
  $(function() {
    // Enable tooltips
    $('[data-toggle="tooltip"]').tooltip();

    // current moment
    var now = moment();

    /* ---------- Appointment picker ---------- */
    $('#appointment_datetime_picker').datetimepicker({
      defaultDate: now,
      format: 'DD/MM/YYYY hh:mm A',
      stepping: 15,
      sideBySide: true,
      useCurrent: true,         // auto-fill with current date/time
      ignoreReadonly: true,
      allowInputToggle: true,
      buttons: {
        showToday: true,
        showClear: true,
        showClose: true
      },
      icons: {
        time: 'far fa-clock',
        date: 'far fa-calendar',
        up: 'fas fa-arrow-up',
        down: 'fas fa-arrow-down',
        previous: 'fas fa-chevron-left',
        next: 'fas fa-chevron-right',
        today: 'far fa-calendar-check',
        clear: 'far fa-trash-alt',
        close: 'far fa-times-circle'
      },
      minDate: moment().startOf('day'),
      maxDate: moment().add(3, 'months').endOf('day'),
      daysOfWeekDisabled: [0] // Disable Sundays
    });

    /* ---------- Patient DOB picker (date-only) ---------- */
    $('#patient_dob_picker').datetimepicker({
      format: 'DD/MM/YYYY',
      useCurrent: false,        // don't prefill with today
      maxDate: moment(),        // no future DOB
      ignoreReadonly: true,
      allowInputToggle: true,
      icons: {
        time: 'far fa-clock',
        date: 'far fa-calendar',
        up: 'fas fa-arrow-up',
        down: 'fas fa-arrow-down',
        previous: 'fas fa-chevron-left',
        next: 'fas fa-chevron-right',
        today: 'far fa-calendar-check',
        clear: 'far fa-trash-alt',
        close: 'far fa-times-circle'
      }
    });

    // When DOB changes, calculate age in years and set patient_age
    $('#patient_dob_picker').on('change.datetimepicker', function(e) {
      if (e.date) {
        var birthDate = e.date; // moment object
        var age = moment().diff(birthDate, 'years'); // years
        $('input[name="patient_age"]').val(age);
      } else {
        // if cleared, clear age too
        $('input[name="patient_age"]').val('');
      }
    });

    // Focus the save button on page load
    window.onload = function() {
      const button = document.getElementById('save-appointment');
      if (button) {
        button.focus();
      }
      
      // Add Enter key handler
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          if (button) {
            button.click();
          }
        }
      });
    };
  });
</script>

{% endblock %}
