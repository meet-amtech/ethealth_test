{% extends "base.html" %}
{% load static %}

{% block css %}
{% endblock %}

{% block content %}

<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <h4 class="page-title">Edit Appointment - {{ appointment.clinic_patient.patient.name }}</h4>
    </div>
</div>
<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <form method="POST" action="{% url 'template_appointment:appointment_update' appointment.id %}">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Doctor</label>
                        <select class="form-control" name="doctor_id">
                            <option value="">Select Doctor</option>
                            {% for doctor in doctors %}
                                <option value="{{ doctor.id }}" {% if appointment.doctor and appointment.doctor.id == doctor.id %}selected{% endif %}>{{ doctor.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Status</label>
                        <select class="form-control" name="appointment_status">
                            {% for value, label in status_choices %}
                                <option value="{{ value }}" {% if appointment.appointment_status == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Name</label>
                        <input class="form-control" type="text" name="patient_name" value="{{ appointment.clinic_patient.patient.name }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Phone Number</label>
                        <input class="form-control" type="text" name="patient_phone" value="{{ phone_number }}" maxlength="10" pattern="[0-9]{10}" placeholder="10 digit phone number">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Patient Age</label>
                        <input class="form-control" type="number" name="patient_age" value="{{ appointment.clinic_patient.patient.age|default:'' }}" min="0" max="150">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Token Number</label>
                        <input class="form-control" type="text" value="{% if token_number %}#{{ token_number }}{% else %}-{% endif %}" readonly>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Appointment Date</label>
                        <div class="cal-icon">
                            <input type="text" class="form-control datetimepicker" name="appointment_date" value="{{ appointment.date_str }}">
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Appointment Time</label>
                        <div class="time-icon">
                            <input type="text" class="form-control" id="datetimepicker3" name="appointment_time" value="{{ appointment.time_str }}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Duration (minutes)</label>
                        <input class="form-control" type="number" name="duration_minutes" value="{{ appointment.duration_minutes }}" min="5" max="480">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Amount To Pay</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">₹</span>
                            </div>
                            <input class="form-control" type="number" min="0" step="0.01" name="amount_to_pay" value="{{ appointment.amount_to_pay|default:0 }}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Payment Status</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="paid" id="paid" {% if appointment.paid %}checked{% endif %}>
                            <label class="form-check-label" for="paid">
                                Mark as Paid
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea class="form-control" name="notes" rows="3">{{ appointment.notes|default:'' }}</textarea>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label>Feedback</label>
                        <textarea class="form-control" name="feedback" rows="3">{{ appointment.feedback|default:'' }}</textarea>
                    </div>
                </div>
            </div>
            <div class="m-t-20 text-center">
                <button id="save-appointment" class="btn btn-primary submit-btn" type="submit">Update Appointment</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block script %}

<script>

    $(function () {
        $('#datetimepicker3').datetimepicker({
            format: 'LT'
        });
        $('.datetimepicker').datetimepicker({
            format: 'DD/MM/YYYY'
        });
    });

    // Function to focus the button and add an event listener for the Enter key
    window.onload = function() {
        const button = document.getElementById('create-appointment');
        button.focus(); // Focus the button
        // Add an event listener for the Enter key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                button.click(); // Trigger the button click
            }
        });
    };

</script>

{% endblock %}
